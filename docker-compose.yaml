name: next-express-boilerplate

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      API_INTERNAL_URL: http://api:4000/api
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api

  api:
    build: ./api
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      FRONTEND_ORIGIN: http://localhost:3000
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: app
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      DB_NAME: app
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./api:/app
      - api-node-modules:/app/node_modules
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
    depends_on:
      - mysql

volumes:
  mysql-data:
  api-node-modules:
  frontend-node-modules:
